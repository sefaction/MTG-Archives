name: Issue guidelines

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled, transferred, closed]

permissions: {}

concurrency:
  group: issue-guidelines-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      # Scope uses the freshly fetched issue, never stale event labels or form text.
      - name: Check internal tracking without prompting public reporters
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { run } = require('./.github/scripts/issue-guidelines.cjs');
            await run({ github, context, core });
