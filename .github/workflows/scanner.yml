name: Windows scanner spike
on:
  pull_request:
    paths:
      - 'tools/scanner-agent/**'
      - 'tools/scanner-twain-count/**'
      - 'lib/scanner-run-protocol.ts'
      - 'tests/scanner-helper-identity.test.ts'
      - '.github/workflows/scanner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: dotnet restore tools/scanner-agent/ScannerAgent.csproj --locked-mode
      - name: Verify counted-feed diagnostic policy without hardware
        shell: pwsh
        run: |
          & tools/scanner-twain-count/build-probe.ps1
          & .local-data/twain-count-probe/CountFeed.exe selftest
          if ($LASTEXITCODE -ne 0) { throw 'Counted-feed policy selftest failed' }
          & .local-data/twain-count-probe/ProfileSettingsInspect.exe selftest
          if ($LASTEXITCODE -ne 0) { throw 'Settings-only inspector policy selftest failed' }
          & tools/scanner-twain-count/test-loop-lifecycle.ps1
      - run: dotnet build tools/scanner-agent/ScannerAgent.csproj --no-restore --configuration Release
      - run: dotnet tools/scanner-agent/bin/Release/net8.0-windows/Mtg.ScannerAgent.dll identity-selftest
      - name: Independently match reported identity to actual source-build payload
        shell: pwsh
        run: |
          $payload = 'tools/scanner-agent/bin/Release/net8.0-windows/Mtg.ScannerAgent.dll'
          $versionJson = (& dotnet $payload version) -join "`n"
          $report = ($versionJson | ConvertFrom-Json).helperIdentity
          if ($LASTEXITCODE -ne 0 -or $report.payloadKind -ne 'MANAGED_ASSEMBLY' -or
              $report.sha256 -ne (Get-FileHash -LiteralPath $payload).Hash.ToLowerInvariant() -or
              $report.moduleVersionId -eq ([guid]::Empty).ToString()) { throw 'Actual helper payload identity differs' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'scanner-helper-identity.json'), $versionJson, [Text.UTF8Encoding]::new($false))
      - name: Actual Windows producer report through the production site protocol
        env:
          SCANNER_HELPER_IDENTITY_REPORT: ${{ runner.temp }}/scanner-helper-identity.json
        run: npx tsx --test tests/scanner-helper-identity.test.ts
      - run: dotnet tools/scanner-agent/bin/Release/net8.0-windows/Mtg.ScannerAgent.dll connection-selftest
      - run: dotnet tools/scanner-agent/bin/Release/net8.0-windows/Mtg.ScannerAgent.dll native-selftest
      - run: dotnet tools/scanner-agent/bin/Release/net8.0-windows/Mtg.ScannerAgent.dll discovery-selftest
      - name: Build and verify local source install without hardware
        shell: pwsh
        run: |
          ./tools/scanner-agent/install-from-source.ps1 -InstallRoot "$env:RUNNER_TEMP\mtg-scanner-source-install"
          $edition = Get-ChildItem "$env:RUNNER_TEMP\mtg-scanner-source-install" -Directory | Select-Object -First 1
          if (-not $edition -or -not (Test-Path (Join-Path $edition.FullName 'NAPS2.Worker.exe')) -or
              -not (Test-Path (Join-Path $edition.FullName 'build-manifest.json'))) {
            throw 'Validated helper copy is incomplete'
          }
      - run: dotnet restore tools/scanner-agent/ScannerAgent.csproj --locked-mode -r win-x64
      - run: dotnet publish tools/scanner-agent/ScannerAgent.csproj --no-restore --configuration Release -r win-x64 --self-contained true -p:OutputType=WinExe -p:PublishSingleFile=false -p:PublishTrimmed=false -o "${{ runner.temp }}/scanner-publish"
      - name: Verify self-contained helper without hardware
        shell: pwsh
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'scanner-publish/Mtg.ScannerAgent.exe'
          if (-not (Test-Path $helper) -or -not (Test-Path (Join-Path $env:RUNNER_TEMP 'scanner-publish/NAPS2.Worker.exe'))) {
            throw 'Self-contained helper is incomplete'
          }
          foreach ($check in @('identity-selftest', 'connection-selftest', 'native-selftest', 'discovery-selftest')) {
            $process = Start-Process -FilePath $helper -ArgumentList $check -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "$check failed: $($process.ExitCode)" }
          }
      - run: node --test tools/scanner-agent/transport.test.mjs
      # CI cannot qualify physical hardware. Never run discovery/scan on hosted CI.
