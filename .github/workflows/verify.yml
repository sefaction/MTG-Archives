name: Verify

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquisition-integrity:
    name: Acquisition PostgreSQL integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: acquisition_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d acquisition_integrity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/acquisition_integrity
      MTG_LOCAL_PILOT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Real acquisition database ownership, concurrency, rollback and replay
        run: npx tsx scripts/verify-acquisition-store.ts

  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OCR line geometry guards
        run: python -m unittest discover -s tools/acquisition-runtime -p test_reading_direction.py
      - name: Tight scan geometry guards (no models or private photos)
        run: |
          pip install numpy==2.2.6 opencv-contrib-python==4.10.0.84 pillow==11.3.0
          python -m unittest discover -s tools/acquisition-eval -p test_geometry.py
          python -m unittest discover -s tools/acquisition-eval -p test_manual_card_region.py
      - name: Photo input and bounded whole-photo text guards (no models or private photos)
        run: python -m unittest discover -s tools/acquisition-runtime -p 'test_photo*.py'
      - name: Public reference and resumable index integrity (no models or private photos)
        run: python -m unittest discover -s tools/acquisition-eval -p 'test_catalog*.py'
      - name: Visual descriptor validation without inference imports
        run: python -m unittest discover -s tools/acquisition-runtime -p test_visual_descriptor.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Printing evidence uncertainty guards (no models or private photos)
        run: |
          python -m unittest discover -s tools/acquisition-eval -p 'test_printing*.py'
          python -m unittest discover -s tools/acquisition-eval -p 'test_expansion_symbols.py'
      - name: Audit attribution and paired-metric guards (no models or private photos)
        run: python -m unittest discover -s tools/recognition-audit -p 'test_*.py'
      - name: Isolated audit scope and bounded evidence-reuse guards
        run: npx tsx --test tools/recognition-audit/*.test.ts
      - name: Generate, typecheck, unit tests and production build guards
        run: npm run verify:core
      - name: Issue guideline validator and feedback lifecycle
        run: node --test .github/scripts/issue-guidelines.test.cjs
      - name: Flat Unraid acquisition worker storage and isolation
        run: npx tsx scripts/verify-acquisition-flat-compose.ts
      - name: Flat Unraid Compose archive defaults
        run: npx tsx scripts/verify-pricing-flat-compose.ts

  import-integrity:
    name: PostgreSQL import integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: import_integrity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d import_integrity"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/import_integrity?schema=public
      MTG_LOCAL_PILOT_TEST: "1"
      PRICING_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/import_integrity
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Scryfall refresh preserves Pricing projections in both writer orders
        run: npx tsx scripts/verify-card-price-preservation.ts
      - name: Real database concurrency, rollback, retry, audit and undo checks
        run: npx tsx scripts/verify-import-commit.ts
      - name: Install PostgreSQL client for asynchronous pricing checks
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Read-only pricing queries, event-loop responsiveness and time limits
        run: npx tsx scripts/verify-pricing-db-query.ts
      - name: Archive-aware Pricing refresh and full rebuild
        run: npx tsx scripts/verify-pricing-archive-aware-refresh.ts
      - name: Interrupted pricing source recovery preserves jobs and all summary tiers
        run: npx tsx scripts/verify-pricing-interrupted-import.ts
      - name: Interrupted app-price publication and explicit catch-up preserve source and history
        run: npx tsx scripts/verify-pricing-interrupted-projection.ts

      - name: MTGJSON provider currency and MTGO pipeline
        run: npx tsx scripts/verify-pricing-provider-currency.ts
      - name: Streamed identifier mapping and malformed-tail conservation
        run: npx tsx scripts/verify-pricing-identifier-worker.ts
      - name: One-sided gifts retain consent and physical inventory integrity
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/trade_gift_fixture?schema=public
          PGPASSWORD: ci
        run: |
          createdb -h 127.0.0.1 -U ci trade_gift_fixture
          npx prisma migrate deploy
          npx tsx scripts/ci/trade-gifts.ts

  inventory-delete-reservations:
    name: Inventory deletion reservation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: inventory_delete_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d inventory_delete_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/inventory_delete_fixture?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/ci/inventory-delete-reservations.ts

  trade-wishlist-integrity:
    name: Trade wishlist PostgreSQL conservation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trade_wishlist_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d trade_wishlist_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/trade_wishlist_fixture?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsx scripts/verify-trade-wishlist-concurrency.ts

  trade-stock-integrity:
    name: Shared trade stock PostgreSQL audit integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trade_stock_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d trade_stock_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/trade_stock_fixture?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Pin pre-repair action source
        run: |
          mkdir -p .local-data/trade-stock
          git show b810f06a18f1e358b970bccf8093e4b1026eeb66:app/trades/actions.ts > .local-data/trade-stock/baseline-actions.ts
      - run: npx tsx scripts/ci/trade-shared-stock.ts

  trade-audit-integrity:
    name: Trade audit PostgreSQL history bounds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: trade_audit_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d trade_audit_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/trade_audit_fixture?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Pin pre-repair source
        run: |
          mkdir -p .local-data/trade-audit
          git show b810f06a18f1e358b970bccf8093e4b1026eeb66:app/trades/actions.ts > .local-data/trade-audit/baseline-actions.ts
      - run: npx tsx scripts/ci/trade-audit-history.ts
      - name: Pinned old proposal source reproduces over-reservation
        env:
          TRADE_PROPOSAL_BASELINE: '1'
        run: |
          git show e133ddd8ab910092de7126f62f4d5f5b5b0a6775:app/trades/actions.ts > .local-data/trade-stock/proposal-baseline-actions.ts
          npx tsx scripts/ci/trade-proposal-reservations.ts
      - name: Concurrent proposals respect available physical stock
        run: npx tsx scripts/ci/trade-proposal-reservations.ts
