name: Qualify 879 isolated browser
on:
  push:
    branches: [codex/qualification-879-ci]
permissions:
  contents: read
concurrency:
  group: qualify-879-isolated
  cancel-in-progress: false
jobs:
  browser:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/qualification-879-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: docker/setup-buildx-action@v3
        id: builder
        with:
          version: latest
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000
      - run: npm ci
      - run: npx tsx --test tests/isolated-qualification-target.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Exact product image and owned browser fixture
        env:
          QUALIFICATION_BUILDER: ${{ steps.builder.outputs.name }}
        run: node .github/scripts/qualify-879.cjs
      - name: Preserve qualification evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-879-isolated-qualification
          path: |
            .local-data/qualification-ci/
            !.local-data/qualification-ci/product-source/**
            !.local-data/qualification-ci/product-source.tar
          retention-days: 7
          if-no-files-found: error
