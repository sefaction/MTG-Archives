name: Publish Docker images

on:
  push:
    branches:
      - main
      - "platform/**"
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-flight push. Keep one publisher and only the newest
# pending run per ref; head checks also reject late reruns of older commits.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  web:
    name: Build and publish ${{ matrix.component }} image
    needs: verify
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/platform/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            image: sefaction/mtg-archives-web
            dockerfile: ./Dockerfile
          - component: recognition
            image: sefaction/mtg-archives-recognition
            dockerfile: ./tools/acquisition-runtime/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check branch head before building
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded revision."
          fi

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        if: steps.head.outputs.current == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image without publishing
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Verify persistent model initialization and offline recognition
        if: steps.head.outputs.current == 'true' && matrix.component == 'recognition'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          model_volume="acquisition-model-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$model_volume"
          trap 'docker volume rm "$model_volume"' EXIT
          docker run --rm --memory 256m -v "$model_volume:/models" --entrypoint python "$tag" /app/tools/acquisition-runtime/download_models.py
          docker run --rm --network none -v "$model_volume:/models:ro" --entrypoint python "$tag" /app/tools/acquisition-runtime/download_models.py --verify-only
          docker run --rm --network none --user 65534:65534 --memory 2g --cpus 1 -v "$model_volume:/models:ro" --entrypoint python "$tag" /app/tools/acquisition-runtime/smoke.py

      - name: Recheck branch head immediately before publication
        if: steps.head.outputs.current == 'true'
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)"
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Branch advanced during build; image will not be published."
          fi

      - name: Publish validated current image
        if: steps.fresh.outputs.current == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"
