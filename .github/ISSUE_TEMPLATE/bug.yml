name: Report a problem
description: Something is not working as you expected.
body:
  - type: markdown
    attributes:
      value: A short description in your own words is enough. You do not need a technical plan.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in your own words.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra details (optional)
      description: If useful, add steps, what you expected, a screenshot, or your browser/device. It is fine to leave this empty. Please leave out passwords and private information.
    validations:
      required: false
