name: bug
description: Report broken behavior
labels: ['type: bug']
body:
  - type: markdown
    attributes:
      value: |
        Search open/closed issues and PRs first; read the current parent scope and latest comments.
        This form applies only its type label. A maintainer must select exactly one workflow status and at least one area using the issue sidebar/API; dropdown text does not apply labels.
        Status: backlog, in progress, investigating, awaiting review, awaiting validation, needs decision.
        Areas: recognition, scanner, review, inventory, data integrity, infrastructure, test infrastructure (all prefixed with 'area: ').
        Add tracker/roadmap/deferred independently where appropriate. See [AGENTS.md](https://github.com/sefaction/MTG-Archives/blob/main/AGENTS.md#github-issue-organization-and-upkeep).
  - type: textarea
    id: outcome
    attributes:
      label: Problem or intended outcome
      description: Describe current/expected behavior, impact and bounded scope. Link parents, duplicates checked, dependencies and children.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and limitations
      description: Include reproduction or requested outcome, exact revision/installation, denominator and limitations as applicable. Distinguish reports from reproduced evidence. Never include secrets.
    validations:
      required: true
  - type: textarea
    id: delivered
    attributes:
      label: Work already done
      description: Link delivered PRs and evidence, or explicitly say none yet. Separate local qualification, independent review, CI, merge, deployment and user acceptance.
    validations:
      required: true
  - type: textarea
    id: remaining
    attributes:
      label: Remaining work and next action
      description: Give the exact next action and separate deferred scope with links/reconsideration triggers. Investigations need a bounded next test, evidence to retain and stopping criterion.
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Acceptance or completion criteria
      description: State observable completion conditions and evidence needed. A partial merge does not complete a parent tracker or imply production/user acceptance.
    validations:
      required: true
