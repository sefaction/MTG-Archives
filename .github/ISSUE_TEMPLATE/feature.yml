name: Suggest an idea
description: Tell us about something you would like to do or make easier.
body:
  - type: markdown
    attributes:
      value: A short description in your own words is enough. You do not need a technical plan.
  - type: textarea
    id: description
    attributes:
      label: What would you like to do?
      description: Describe your idea or what would make the app easier to use.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Extra details (optional)
      description: If you want, add an example or screenshot. It is fine to leave this empty.
    validations:
      required: false
