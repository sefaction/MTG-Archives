# Optional local printing evidence. Uses the same durable photos and candidates.
services:
  web:
    environment:
      ACQUISITION_PRINTING_ENABLED: "1"
  acquisition-worker:
    environment:
      ACQUISITION_PRINTING_ENABLED: "1"
  acquisition-printing-worker:
    image: mtg-acquisition-visual:local
    pull_policy: never
    entrypoint: [node, node_modules/tsx/dist/cli.mjs, scripts/acquisition-printing-worker.ts]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtginventory}:${POSTGRES_PASSWORD:-mtginventory}@postgres:5432/${POSTGRES_DB:-mtginventory}?schema=public
      UPLOADS_DATA_PATH: /app/data/uploads
    volumes:
      - ./.local-data/uploads:/app/data/uploads:ro
      - ${MTG_ACQUISITION_VISUAL_INDEX_PATH:?Set complete published visual index path}:/visual/index:ro
      - ${MTG_ACQUISITION_VISUAL_REFERENCES_PATH:?Set verified public reference path}:/visual/references:ro
    networks: [acquisition-internal]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 130s
