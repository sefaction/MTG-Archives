# Optional MTG Archives Pricing recovery copies. The base Compose stack already
# mounts BACKUPS_DATA_PATH; create its pricing-recovery child before enabling an
# archive operation. Keep this separate from BACKUP_DIR/pricing source files.
services:
  web:
    environment:
      PRICING_RECOVERY_COPY_DIR: ${BACKUP_DIR:-/app/backups}/pricing-recovery

  pricing-archive-maintenance:
    environment:
      PRICING_RECOVERY_COPY_DIR: ${BACKUP_DIR:-/app/backups}/pricing-recovery
