# Local-only capture worker. Combine with the ordinary local Compose files.
services:
  acquisition-worker:
    image: mtg-archives-web:local
    pull_policy: never
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/acquisition-worker.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtginventory}:${POSTGRES_PASSWORD:-mtginventory}@postgres:5432/${POSTGRES_DB:-mtginventory}?schema=public
      UPLOADS_DATA_PATH: /app/data/uploads
    volumes:
      - ./.local-data/uploads:/app/data/uploads
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
