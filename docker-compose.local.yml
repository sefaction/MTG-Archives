services:
  postgres:
    volumes:
      - ./.local-data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-15435}:5432"

  pricing-postgres:
    volumes: !override
      - ./.local-data/pricing-postgres:/var/lib/postgresql/data
    ports:
      - "${PRICING_POSTGRES_HOST_PORT:-15436}:5432"

  pricing-retention-clone-postgres:
    profiles: ["pricing-retention-drill"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${PRICING_POSTGRES_USER:-mtgpricing}
      POSTGRES_PASSWORD: ${PRICING_POSTGRES_PASSWORD:-mtgpricing}
    volumes:
      - pricing_retention_clone_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    volumes: !override
      - ./.local-data/redis:/data

  web:
    image: mtg-archives-web:local
    build:
      context: ${MTG_REVIEW_BUILD_CONTEXT:-.}
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      UPLOADS_DATA_PATH: /app/data/uploads
      IMPORTS_DATA_PATH: /app/data/imports
      EXPORTS_DATA_PATH: /app/data/exports
      BACKUPS_DATA_PATH: /app/data/backups
      BACKUP_DIR: /app/data/backups
      PRICING_RECOVERY_COPY_DIR: /app/data/backups/pricing-recovery
      SCRYFALL_CONTAINER_DATA_PATH: /app/data/scryfall
      SCRYFALL_DATA_PATH: /app/data/scryfall
    volumes: !override
      - ./.local-data/uploads:/app/data/uploads
      - ./.local-data/imports:/app/data/imports
      - ./.local-data/exports:/app/data/exports
      - ./.local-data/backups:/app/data/backups
      - ./.local-data/scryfall:/app/data/scryfall
    ports:
      - "${WEB_HOST_PORT:-13001}:3000"

  pricing-worker:
    image: mtg-archives-web:local
    build:
      context: ${MTG_REVIEW_BUILD_CONTEXT:-.}
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      PRICING_IMPORT_MAX_CARDS: ${PRICING_IMPORT_MAX_CARDS:-0}
      BACKUP_DIR: /app/data/backups
    volumes: !override
      - ./.local-data/backups:/app/data/backups

  pricing-archive-maintenance:
    image: mtg-archives-web:local
    build:
      context: ${MTG_REVIEW_BUILD_CONTEXT:-.}
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      BACKUP_DIR: /app/data/backups
      PRICING_RECOVERY_COPY_DIR: /app/data/backups/pricing-recovery
    volumes: !override
      - ./.local-data/backups:/app/data/backups

  notification-worker:
    image: mtg-archives-web:local
    build:
      context: ${MTG_REVIEW_BUILD_CONTEXT:-.}
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      BACKUP_DIR: /app/data/backups
    volumes: !override
      - ./.local-data/backups:/app/data/backups

  backup:
    image: mtg-archives-web:local
    build:
      context: ${MTG_REVIEW_BUILD_CONTEXT:-.}
      dockerfile: ./Dockerfile
    pull_policy: build
    environment:
      UPLOADS_DATA_PATH: /app/data/uploads
      IMPORTS_DATA_PATH: /app/data/imports
      EXPORTS_DATA_PATH: /app/data/exports
      BACKUPS_DATA_PATH: /app/data/backups
      BACKUP_DIR: /app/data/backups
      SCRYFALL_CONTAINER_DATA_PATH: /app/data/scryfall
      SCRYFALL_DATA_PATH: /app/data/scryfall
    volumes: !override
      - ./.local-data/uploads:/app/data/uploads
      - ./.local-data/imports:/app/data/imports
      - ./.local-data/exports:/app/data/exports
      - ./.local-data/backups:/app/data/backups
      - ./.local-data/scryfall:/app/data/scryfall

volumes:
  pricing_retention_clone_data:
