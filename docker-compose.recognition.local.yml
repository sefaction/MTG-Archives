# Local CPU recognition with persistent model files, using the deployment image recipe.
services:
  postgres:
    networks: [default, acquisition-internal]
  acquisition-model-init:
    image: mtg-acquisition-recognition:local
    pull_policy: never
    restart: on-failure
    entrypoint: ["python", "/app/tools/acquisition-runtime/download_models.py"]
    volumes:
      - ${MTG_ACQUISITION_MODELS_PATH:-./.local-data/acquisition-models}:/models
    mem_limit: 256m
    cpus: 1.0
  acquisition-recognition-worker:
    image: mtg-acquisition-recognition:local
    pull_policy: never
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mtginventory}:${POSTGRES_PASSWORD:-mtginventory}@postgres:5432/${POSTGRES_DB:-mtginventory}?schema=public
      UPLOADS_DATA_PATH: /app/data/uploads
    volumes:
      - ./.local-data/uploads:/app/data/uploads:ro
      - ${MTG_ACQUISITION_MODELS_PATH:-./.local-data/acquisition-models}:/models:ro
    networks: [acquisition-internal]
    depends_on:
      acquisition-model-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 60s
networks:
  acquisition-internal:
    internal: true
