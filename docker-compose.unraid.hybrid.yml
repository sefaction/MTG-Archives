# Explicit opt-in AFTER docker-compose.unraid.flat.yml.
# See docs/ACQUISITION_HYBRID_DEPLOYMENT.md before activation. No asset downloads.
services:
  web:
    environment:
      ACQUISITION_VISUAL_ENABLED: "1"
      ACQUISITION_PRINTING_ENABLED: "1"
  acquisition-catalog-worker:
    environment:
      ACQUISITION_VISUAL_ENABLED: "1"
      # This process owns auto-confirmation; hybrid recognition stays review-only.
      ACQUISITION_PRINTING_ENABLED: "1"
  acquisition-worker:
    environment:
      ACQUISITION_PRINTING_ENABLED: "1"
  acquisition-visual-worker:
    image: ${ACQUISITION_VISUAL_IMAGE:-ghcr.io/sefaction/mtg-archives-visual:${IMAGE_TAG:-main}}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the existing application database URL}
      UPLOADS_DATA_PATH: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
    volumes:
      - type: bind
        source: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
        target: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACQUISITION_VISUAL_INDEX_PATH:?Set the complete published index directory}
        target: /visual/index
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACQUISITION_VISUAL_MODELS_PATH:?Set the verified encoder directory}
        target: /visual/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACQUISITION_VISUAL_REFERENCES_PATH:?Set the public references directory}
        target: /visual/references
        read_only: true
        bind:
          create_host_path: false
    networks: [acquisition-internal]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 130s
  acquisition-printing-worker:
    image: ${ACQUISITION_VISUAL_IMAGE:-ghcr.io/sefaction/mtg-archives-visual:${IMAGE_TAG:-main}}
    pull_policy: always
    entrypoint: [node, node_modules/tsx/dist/cli.mjs, scripts/acquisition-printing-worker.ts]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the existing application database URL}
      UPLOADS_DATA_PATH: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
    volumes:
      - type: bind
        source: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
        target: ${UPLOADS_DATA_PATH:?Set the existing uploads path}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACQUISITION_VISUAL_INDEX_PATH:?Set the complete published index directory}
        target: /visual/index
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ACQUISITION_VISUAL_REFERENCES_PATH:?Set the public references directory}
        target: /visual/references
        read_only: true
        bind:
          create_host_path: false
    networks: [acquisition-internal]
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 130s
